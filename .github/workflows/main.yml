<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f291e" />
  <title>MT GC AGT - CRPF Motor Transport Live</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF & AutoTable for Clean PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }
    .crpf-gradient {
      background: linear-gradient(135deg, #0b2518 0%, #16422c 60%, #1e563a 100%);
    }
    .gold-accent {
      border-bottom: 3px solid #d97706;
    }
  </style>
</head>
<body class="text-slate-800 pb-20 select-none">

  <!-- LIVE NOTIFICATION BANNER -->
  <div id="liveToast" class="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 hidden w-11/12 max-w-md bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border-l-4 border-amber-500 flex items-center gap-3 transition-all">
    <i data-lucide="bell-ring" class="w-5 h-5 text-amber-400 shrink-0"></i>
    <div class="text-xs">
      <p class="font-bold text-amber-400" id="toastTitle">MT GC AGT Live Update</p>
      <p id="toastMsg" class="text-slate-200 mt-0.5">Data synchronized across all devices.</p>
    </div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="min-h-screen crpf-gradient flex flex-col justify-center items-center p-5">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden">
      <div class="crpf-gradient p-6 text-center text-white gold-accent">
        <div class="w-20 h-20 mx-auto bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center border border-amber-400/50 mb-3 shadow-lg">
          <i data-lucide="truck" class="w-11 h-11 text-amber-400"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-wide">MT GC AGT</h1>
        <p class="text-xs text-emerald-200 uppercase tracking-widest mt-1">Motor Transport Platoon • GC CRPF Agartala</p>
      </div>

      <form id="loginForm" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Force Number (Username)</label>
          <div class="relative">
            <i data-lucide="shield" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="text" id="loginForceNo" required placeholder="e.g. 165060166"
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-emerald-700" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
            <input type="password" id="loginPassword" required placeholder="Mt@[ForceNo]"
              class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:border-emerald-700" />
          </div>
          <p class="text-[11px] text-slate-500 mt-1">Default Password: <b>Mt@ForceNo</b> (Admin: 165060166)</p>
        </div>

        <p id="loginError" class="text-xs text-red-600 font-semibold hidden bg-red-50 p-2.5 rounded-lg border border-red-200"></p>

        <button type="submit" class="w-full crpf-gradient text-white font-bold py-3.5 rounded-xl shadow-lg hover:opacity-95 transition flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>SECURE LOGIN</span>
        </button>
      </form>
    </div>
    <p class="text-emerald-200/70 text-[11px] mt-6">Connected to Firebase: mt-gc-agt-default-rtdb</p>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="mainApp" class="hidden max-w-4xl mx-auto">
    
    <!-- TOP HEADER -->
    <header class="crpf-gradient text-white px-4 py-3.5 sticky top-0 z-30 shadow-lg gold-accent">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-amber-500/20 border border-amber-400/60 rounded-xl flex items-center justify-center">
            <i data-lucide="truck" class="w-6 h-6 text-amber-400"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-extrabold text-lg leading-none">MT GC AGT</h1>
              <span id="syncBadge" class="text-[10px] bg-emerald-500/30 text-emerald-200 px-2 py-0.5 rounded-full border border-emerald-400/40 flex items-center gap-1">
                <span id="syncDot" class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="syncText">CONNECTING...</span>
              </span>
            </div>
            <p class="text-[11px] text-emerald-200 mt-0.5" id="loggedUserInfo">Loading...</p>
          </div>
        </div>
        <button onclick="logout()" class="p-2 bg-white/10 hover:bg-red-500/80 rounded-xl transition" title="Logout">
          <i data-lucide="log-out" class="w-5 h-5"></i>
        </button>
      </div>
    </header>

    <!-- TAB CONTENT AREA -->
    <main class="p-4 space-y-5">

      <!-- 1. DASHBOARD TAB -->
      <section id="tab-dashboard" class="space-y-5">
        
        <!-- PERSONNEL PARADE STATE -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-slate-800 text-white px-4 py-2.5 flex justify-between items-center">
            <h2 class="text-xs font-bold uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="users" class="w-4 h-4 text-amber-400"></i> Personnel Parade State
            </h2>
            <span class="text-xs font-extrabold bg-amber-500 text-slate-900 px-2.5 py-0.5 rounded-full" id="pTotalCount">Total: 49</span>
          </div>
          <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 p-3 text-center">
            <div onclick="filterPersonnelByStatus('PRESENT')" class="cursor-pointer bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-emerald-700" id="pPresentCount">0</p>
              <p class="text-[10px] font-bold text-emerald-800 uppercase">Present</p>
            </div>
            <div onclick="filterPersonnelByStatus('ON DUTY')" class="cursor-pointer bg-blue-50 border border-blue-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-blue-700" id="pDutyCount">0</p>
              <p class="text-[10px] font-bold text-blue-800 uppercase">On Duty</p>
            </div>
            <div onclick="filterPersonnelByStatus('LEAVE')" class="cursor-pointer bg-red-50 border border-red-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-red-700" id="pLeaveCount">0</p>
              <p class="text-[10px] font-bold text-red-800 uppercase">Leave</p>
            </div>
            <div onclick="filterPersonnelByStatus('COURSE')" class="cursor-pointer bg-purple-50 border border-purple-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-purple-700" id="pCourseCount">0</p>
              <p class="text-[10px] font-bold text-purple-800 uppercase">Course</p>
            </div>
            <div onclick="filterPersonnelByStatus('ATTACHMENT')" class="cursor-pointer bg-amber-50 border border-amber-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-amber-700" id="pAttachCount">0</p>
              <p class="text-[10px] font-bold text-amber-800 uppercase">Attachment</p>
            </div>
            <div onclick="filterPersonnelByStatus('OTHER')" class="cursor-pointer bg-slate-100 border border-slate-300 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-slate-700" id="pOtherCount">0</p>
              <p class="text-[10px] font-bold text-slate-800 uppercase">Rest/Hosp</p>
            </div>
          </div>
        </div>

        <!-- VEHICLE FLEET STATE -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-emerald-900 text-white px-4 py-2.5 flex justify-between items-center">
            <h2 class="text-xs font-bold uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="car-front" class="w-4 h-4 text-amber-400"></i> MT Vehicle Fleet State
            </h2>
            <span class="text-xs font-extrabold bg-amber-500 text-slate-900 px-2.5 py-0.5 rounded-full" id="vTotalCount">Total: 38</span>
          </div>
          <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 p-3 text-center">
            <div onclick="filterVehiclesByStatus('PRESENT')" class="cursor-pointer bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-emerald-700" id="vPresentCount">0</p>
              <p class="text-[10px] font-bold text-emerald-800 uppercase">Present (IN)</p>
            </div>
            <div onclick="filterVehiclesByStatus('ON DUTY')" class="cursor-pointer bg-blue-50 border border-blue-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-blue-700" id="vDutyCount">0</p>
              <p class="text-[10px] font-bold text-blue-800 uppercase">On Duty (OUT)</p>
            </div>
            <div onclick="filterVehiclesByStatus('OFF ROAD')" class="cursor-pointer bg-red-50 border border-red-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-red-700" id="vOffRoadCount">0</p>
              <p class="text-[10px] font-bold text-red-800 uppercase">Off Road</p>
            </div>
            <div onclick="filterVehiclesByStatus('UNDER CBP')" class="cursor-pointer bg-orange-50 border border-orange-200 p-2.5 rounded-xl">
              <p class="text-xl font-extrabold text-orange-700" id="vCbpCount">0</p>
              <p class="text-[10px] font-bold text-orange-800 uppercase">Under CBP</p>
            </div>
            <div onclick="filterVehiclesByStatus('ATTACHMENT')" class="cursor-pointer bg-purple-50 border border-purple-200 p-2.5 rounded-xl col-span-2 sm:col-span-1">
              <p class="text-xl font-extrabold text-purple-700" id="vAttachCount">0</p>
              <p class="text-[10px] font-bold text-purple-800 uppercase">Attachment</p>
            </div>
          </div>
        </div>

        <!-- LIVE GATE IN / OUT REGISTER -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="bg-slate-900 text-white px-4 py-3 flex justify-between items-center">
            <h2 class="text-xs font-bold uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="arrow-left-right" class="w-4 h-4 text-amber-400"></i> Vehicle IN / OUT Gate Register
            </h2>
            <button onclick="openGateOutModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-extrabold px-3 py-1.5 rounded-lg flex items-center gap-1 shadow">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i> VEHICLE OUT
            </button>
          </div>
          <div id="activeGateLogs" class="divide-y divide-slate-100 max-h-80 overflow-y-auto"></div>
        </div>

      </section>

      <!-- 2. PERSONNEL TAB -->
      <section id="tab-personnel" class="hidden space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-base font-extrabold text-slate-800">MT Personnel Directory</h2>
          <div class="flex gap-2">
            <button onclick="exportPersonnelPDF()" class="bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow">
              <i data-lucide="file-down" class="w-4 h-4 text-amber-400"></i> PDF (No Leave Col)
            </button>
            <button onclick="openAddPersonnelModal()" class="admin-only hidden bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow">
              <i data-lucide="user-plus" class="w-4 h-4"></i> Add Staff
            </button>
          </div>
        </div>

        <div class="flex gap-2">
          <input type="text" id="personnelSearch" oninput="renderPersonnel()" placeholder="Search Name, Force No, Rank..."
            class="flex-1 px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-medium focus:outline-none focus:border-emerald-700" />
          <select id="personnelStatusFilter" onchange="renderPersonnel()" class="px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-bold">
            <option value="ALL">ALL STATUS</option>
            <option value="PRESENT">PRESENT</option>
            <option value="ON DUTY">ON DUTY</option>
            <option value="LEAVE">LEAVE</option>
            <option value="COURSE">COURSE</option>
            <option value="ATTACHMENT">ATTACHMENT</option>
            <option value="OTHER">REST/HOSP</option>
          </select>
        </div>

        <div id="personnelList" class="space-y-2.5"></div>
      </section>

      <!-- 3. VEHICLES TAB -->
      <section id="tab-vehicles" class="hidden space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-base font-extrabold text-slate-800">MT Fleet & Vehicles</h2>
          <div class="flex gap-2">
            <button onclick="exportVehiclesPDF()" class="bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow">
              <i data-lucide="file-down" class="w-4 h-4 text-amber-400"></i> Fleet PDF
            </button>
            <button onclick="openAddVehicleModal()" class="admin-only hidden bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow">
              <i data-lucide="plus" class="w-4 h-4"></i> Add Vehicle
            </button>
          </div>
        </div>

        <div class="flex gap-2">
          <input type="text" id="vehicleSearch" oninput="renderVehicles()" placeholder="Search Reg No (e.g. AS01) or Type..."
            class="flex-1 px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-medium focus:outline-none focus:border-emerald-700" />
          <select id="vehicleStatusFilter" onchange="renderVehicles()" class="px-3 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-bold">
            <option value="ALL">ALL VEHICLES</option>
            <option value="PRESENT">PRESENT</option>
            <option value="ON DUTY">ON DUTY</option>
            <option value="OFF ROAD">OFF ROAD</option>
            <option value="UNDER CBP">UNDER CBP</option>
            <option value="ATTACHMENT">ATTACHMENT</option>
          </select>
        </div>

        <div id="vehicleList" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
      </section>

      <!-- 4. DUTY ROSTER TAB -->
      <section id="tab-duty" class="hidden space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-base font-extrabold text-slate-800">MT Duty Roster (HC & CT Selection)</h2>
          <button onclick="exportDutyPDF()" class="bg-slate-800 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5 shadow">
            <i data-lucide="printer" class="w-4 h-4 text-amber-400"></i> Duty PDF
          </button>
        </div>

        <div class="admin-only hidden bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <h3 class="text-xs font-extrabold uppercase text-emerald-800 flex items-center gap-1.5">
            <i data-lucide="clipboard-check" class="w-4 h-4"></i> Assign Duty (Filter by Rank)
          </h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <div>
              <label class="text-[11px] font-bold text-slate-500">1. Duty Point / Post</label>
              <select id="dutyPostSelect" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold">
                <option value="POLE GUARD (1 HC + 4 CT)">Pole Guard (1 HC + 4 CT)</option>
                <option value="MT PARK GUARD (1 HC + 1 CT)">MT Park Guard (1 HC + 1 CT)</option>
                <option value="MT MUNSHI / GATE DUTY">MT Munshi / Gate Duty</option>
                <option value="SCHOOL BUS / CONVOY DUTY">School Bus / Convoy Duty</option>
                <option value="WORKSHOP / REPAIR DUTY">Workshop / Repair Duty</option>
                <option value="ADMIN / OFFICE ATTACHMENT">Admin / Office Attachment</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-500">2. Filter Rank (HC / CT)</label>
              <select id="dutyRankFilter" onchange="populateDutyPersonnelDropdown()" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold">
                <option value="ALL">All Ranks</option>
                <option value="HC">Only Head Constables (HC)</option>
                <option value="CT">Only Constables (CT)</option>
                <option value="SO">Subordinate Officers (INSP/SI/ASI)</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-bold text-slate-500">3. Select Personnel</label>
              <select id="dutyPersonnelSelect" class="w-full mt-1 p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold"></select>
            </div>
          </div>
          <button onclick="assignDuty()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold py-2.5 rounded-xl shadow">
            + ASSIGN DUTY & SYNC LIVE
          </button>
        </div>

        <div id="dutyRosterList" class="space-y-2.5"></div>
      </section>

      <!-- 5. DOCUMENTS & ADMIN PANEL TAB -->
      <section id="tab-docs" class="hidden space-y-5">
        
        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-sm font-extrabold text-slate-800 flex items-center gap-2">
              <i data-lucide="folder-open" class="w-4 h-4 text-amber-600"></i> Official Orders & Documents
            </h2>
          </div>

          <div class="admin-only hidden bg-slate-50 p-3 rounded-xl border border-dashed border-slate-300 space-y-2.5">
            <input type="text" id="docTitle" placeholder="Document Title (e.g. Monthly Inspection Roster Nov 2026)"
              class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs font-semibold" />
            <div class="flex items-center gap-2">
              <input type="file" id="docFileInput" accept=".pdf,image/*,.doc,.docx" class="text-xs flex-1" />
              <button onclick="uploadDocument()" class="bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-lg shrink-0">
                Upload
              </button>
            </div>
          </div>

          <div id="documentsList" class="divide-y divide-slate-100"></div>
        </div>

        <!-- ADMIN CONTROL CENTER -->
        <div class="admin-only hidden bg-white p-4 rounded-2xl border-2 border-amber-400 shadow-sm space-y-4">
          <h3 class="text-sm font-extrabold text-slate-900 flex items-center gap-2">
            <i data-lucide="shield-alert" class="w-5 h-5 text-amber-600"></i> Admin Control Center
          </h3>

          <div class="bg-slate-50 p-3 rounded-xl space-y-2">
            <p class="text-xs font-bold text-slate-700">1. Change / Reset Personnel Password</p>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <select id="resetPassUserSelect" class="p-2 bg-white border border-slate-300 rounded-lg text-xs font-bold"></select>
              <input type="text" id="newPassInput" placeholder="New Password (blank = default)" class="p-2 bg-white border border-slate-300 rounded-lg text-xs" />
              <button onclick="adminResetPassword()" class="bg-slate-800 text-white text-xs font-bold py-2 rounded-lg">Update Password</button>
            </div>
          </div>

          <div class="bg-red-50 p-3 rounded-xl border border-red-200 space-y-2">
            <p class="text-xs font-bold text-red-800">2. Transfer Admin ID Rights</p>
            <p class="text-[11px] text-red-600">Warning: Transferring Admin ID will hand over full administrative control to the selected personnel.</p>
            <div class="flex gap-2">
              <select id="transferAdminSelect" class="flex-1 p-2 bg-white border border-red-300 rounded-lg text-xs font-bold"></select>
              <button onclick="transferAdminRights()" class="bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-lg">Transfer Admin</button>
            </div>
          </div>
        </div>

      </section>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-1.5 z-30 shadow-lg">
      <div class="max-w-4xl mx-auto grid grid-cols-5 text-center">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn text-emerald-800 flex flex-col items-center py-1">
          <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
          <span class="text-[10px] font-bold mt-0.5">Dashboard</span>
        </button>
        <button onclick="switchTab('personnel')" id="nav-personnel" class="nav-btn text-slate-400 flex flex-col items-center py-1">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span class="text-[10px] font-bold mt-0.5">Staff (49)</span>
        </button>
        <button onclick="switchTab('vehicles')" id="nav-vehicles" class="nav-btn text-slate-400 flex flex-col items-center py-1">
          <i data-lucide="truck" class="w-5 h-5"></i>
          <span class="text-[10px] font-bold mt-0.5">Vehicles</span>
        </button>
        <button onclick="switchTab('duty')" id="nav-duty" class="nav-btn text-slate-400 flex flex-col items-center py-1">
          <i data-lucide="clipboard-list" class="w-5 h-5"></i>
          <span class="text-[10px] font-bold mt-0.5">Duty</span>
        </button>
        <button onclick="switchTab('docs')" id="nav-docs" class="nav-btn text-slate-400 flex flex-col items-center py-1">
          <i data-lucide="folder-cog" class="w-5 h-5"></i>
          <span class="text-[10px] font-bold mt-0.5">Docs/Admin</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- MODALS -->
  <div id="personnelModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
      <div class="crpf-gradient text-white p-4 flex justify-between items-center">
        <h3 class="font-bold text-sm">Personnel Service & Profile Details</h3>
        <button onclick="closeModal('personnelModal')"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="personnelModalBody" class="p-4 overflow-y-auto space-y-3 text-xs"></div>
    </div>
  </div>

  <div id="vehicleModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
