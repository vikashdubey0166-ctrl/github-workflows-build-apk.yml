  <!-- FIREBASE REALTIME DATABASE LIVE SYNC (CONFIGURED FOR mt-gc-agt) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      projectId: "mt-gc-agt",
      databaseURL: "https://mt-gc-agt-default-rtdb.firebaseio.com"
    };

    window.cloudSyncEnabled = false;
    let isInitialCloudLoad = true;
    let lastSeenNotifId = null;

    function updateSyncStatus(connected) {
      const dot = document.getElementById("syncDot");
      const text = document.getElementById("syncText");
      if (!dot || !text) return;
      if (connected) {
        dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse";
        text.innerText = "CLOUD LIVE";
      } else {
        dot.className = "w-1.5 h-1.5 rounded-full bg-amber-400";
        text.innerText = "LOCAL MODE";
      }
    }

    try {
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const dbRef = ref(db, 'mt_gc_agt_live_data');

      window.cloudSyncEnabled = true;

      window.pushToCloud = (data) => {
        set(dbRef, data)
          .then(() => updateSyncStatus(true))
          .catch((err) => {
            console.error("Firebase Write Error:", err);
            updateSyncStatus(false);
          });
      };

      // Check if cloud already has data; if empty, seed initial 49 staff + 38 vehicles
      get(dbRef).then((snapshot) => {
        if (!snapshot.exists() && window.getAppState) {
          set(dbRef, window.getAppState());
        }
      }).catch(e => console.warn("Initial cloud check:", e));

      // Real-time listener across all devices
      onValue(dbRef, (snapshot) => {
        updateSyncStatus(true);
        const val = snapshot.val();
        if (val && window.onCloudUpdate) {
          // Ensure arrays are intact (Firebase sometimes converts sparse arrays)
          if (val.personnel && !Array.isArray(val.personnel)) val.personnel = Object.values(val.personnel);
          if (val.vehicles && !Array.isArray(val.vehicles)) val.vehicles = Object.values(val.vehicles);
          if (val.gateLogs && !Array.isArray(val.gateLogs)) val.gateLogs = Object.values(val.gateLogs);
          if (val.duties && !Array.isArray(val.duties)) val.duties = Object.values(val.duties);
          if (val.documents && !Array.isArray(val.documents)) val.documents = Object.values(val.documents);

          const shouldNotify = !isInitialCloudLoad && val.lastNotification && val.lastNotification.id !== lastSeenNotifId;
          if (val.lastNotification) lastSeenNotifId = val.lastNotification.id;
          isInitialCloudLoad = false;

          window.onCloudUpdate(val, shouldNotify);
        }
      }, (error) => {
        console.error("Firebase Sync Error:", error);
        updateSyncStatus(false);
      });

    } catch (e) {
      console.warn("Firebase init fallback:", e);
      updateSyncStatus(false);
    }
  </script>

