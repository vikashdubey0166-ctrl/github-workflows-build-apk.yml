    function handlePhotoUpload(e, forceNo) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          canvas.width = 160;
          canvas.height = 160;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, 160, 160);
          const p = appState.personnel.find(x => x.forceNo === forceNo);
          if (p) {
            p.photo = canvas.toDataURL("image/jpeg", 0.72);
            saveState(`Photo updated for ${p.name}`);
            openPersonnelDetail(forceNo);
          }
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    function savePersonnelEdit(forceNo) {
      const p = appState.personnel.find(x => x.forceNo === forceNo);
      if (!p) return;
      p.rank = document.getElementById("editPRank").value.trim();
      p.mobile = document.getElementById("editPMobile").value.trim();
      p.status = document.getElementById("editPStatus").value;
      p.attachment = document.getElementById("editPAttach").value.trim();
      if (p.rank.includes("DVR")) {
        p.dlNo = document.getElementById("editPDlNo").value.trim();
        p.dlValid = document.getElementById("editPDlValid").value;
      }
      closeModal("personnelModal");
      saveState(`Updated details of ${p.rank} ${p.name}`);
    }

    function deletePersonnel(forceNo) {
      if (forceNo === appState.adminForceNo) {
        alert("Cannot delete active Admin! Transfer Admin rights first.");
        return;
      }
      if (!confirm("Remove this personnel from MT GC AGT?")) return;
      appState.personnel = appState.personnel.filter(x => x.forceNo !== forceNo);
      closeModal("personnelModal");
      saveState(`Removed Force No ${forceNo} from roster`);
    }

    // ==========================================
    // 7. VEHICLES DIRECTORY & DETAIL MODAL
    // ==========================================
    function renderVehicles() {
      const q = document.getElementById("vehicleSearch").value.toLowerCase();
      const statusF = document.getElementById("vehicleStatusFilter").value;

      const filtered = appState.vehicles.filter(v => {
        const matchQ = v.regNo.toLowerCase().includes(q) || v.type.toLowerCase().includes(q);
        const matchS = statusF === "ALL" || v.status === statusF;
        return matchQ && matchS;
      });

      document.getElementById("vehicleList").innerHTML = filtered.map(v => `
        <div onclick="openVehicleDetail('${v.regNo}')" class="cursor-pointer bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm hover:border-emerald-700 transition">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="text-sm font-extrabold text-slate-900">${v.regNo}</h3>
              <p class="text-xs font-bold text-emerald-800">${v.type} <span class="text-slate-400 font-normal">(${v.year})</span></p>
            </div>
            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full border ${getStatusBadge(v.status)}">${v.status}</span>
          </div>
          <div class="mt-2 pt-2 border-t border-slate-100 text-[11px] text-slate-500 flex justify-between">
            <span>Charge: <b>${v.chargeHolder || 'MT Pool'}</b></span>
            <span>${v.km} KM</span>
          </div>
          ${v.attachment ? `<p class="text-[10px] text-purple-700 font-bold mt-1">${v.attachment}</p>` : ''}
        </div>
      `).join("");
    }

    function openVehicleDetail(regNo) {
      const v = appState.vehicles.find(x => x.regNo === regNo);
      if (!v) return;

      const logs = (appState.gateLogs || []).filter(l => l.regNo === regNo).slice(0, 5);

      let html = `
        <div class="bg-slate-50 p-3 rounded-xl space-y-1.5">
          <h4 class="text-base font-extrabold text-slate-900">${v.regNo} — ${v.type}</h4>
          <p>Model Year: <b>${v.year}</b> | Monthly Inspection: <b>${v.inspDate}</b></p>
          <p>Current KM: <b>${v.km} KM</b> | Status: <b>${v.status}</b></p>
          <p>Charge Holder: <b>${v.chargeHolder}</b></p>
          ${v.attachment ? `<p class="text-purple-700 font-bold">Attachment: ${v.attachment}</p>` : ''}
        </div>

        <div>
          <p class="font-bold text-slate-700 mb-1">Recent Movement Logbook</p>
          ${logs.length ? logs.map(l => `
            <div class="p-2 bg-slate-50 rounded border mb-1 text-[11px]">
              <b>${l.driverName}</b> → ${l.dest} (${l.outKm} to ${l.inKm || 'Running'} KM)
            </div>
          `).join("") : `<p class="text-slate-400">No recent logbook entries.</p>`}
        </div>
      `;

      if (isAdmin()) {
        html += `
          <div class="border-t pt-3 space-y-2.5">
            <p class="font-extrabold text-emerald-800 uppercase">Admin Edit Vehicle Details</p>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="font-bold text-slate-600">Status</label>
                <select id="editVStatus" class="w-full p-2 border rounded-lg font-bold">
                  <option value="PRESENT" ${v.status==='PRESENT'?'selected':''}>PRESENT</option>
                  <option value="ON DUTY" ${v.status==='ON DUTY'?'selected':''}>ON DUTY</option>
                  <option value="OFF ROAD" ${v.status==='OFF ROAD'?'selected':''}>OFF ROAD</option>
                  <option value="UNDER CBP" ${v.status==='UNDER CBP'?'selected':''}>UNDER CBP</option>
                  <option value="ATTACHMENT" ${v.status==='ATTACHMENT'?'selected':''}>ATTACHMENT</option>
                </select>
              </div>
              <div>
                <label class="font-bold text-slate-600">Current KM</label>
                <input type="number" id="editVKm" value="${v.km}" class="w-full p-2 border rounded-lg font-bold" />
              </div>
            </div>
            <div>
              <label class="font-bold text-slate-600">Charge Holder Driver</label>
              <input type="text" id="editVCharge" value="${v.chargeHolder || ''}" class="w-full p-2 border rounded-lg font-bold" />
            </div>
            <div>
              <label class="font-bold text-slate-600">Attachment / Off-Road Reason</label>
              <input type="text" id="editVAttach" value="${v.attachment || ''}" placeholder="e.g. Attached with M&N Sector / Repair" class="w-full p-2 border rounded-lg" />
            </div>
            <div class="flex gap-2 pt-2">
              <button onclick="saveVehicleEdit('${v.regNo}')" class="flex-1 bg-emerald-700 text-white font-bold py-2.5 rounded-xl">SAVE VEHICLE</button>
              <button onclick="deleteVehicle('${v.regNo}')" class="bg-red-600 text-white font-bold px-3 py-2.5 rounded-xl">DELETE</button>
            </div>
          </div>
        `;
      }

      document.getElementById("vehicleModalBody").innerHTML = html;
      document.getElementById("vehicleModal").classList.remove("hidden");
    }

    function saveVehicleEdit(regNo) {
      const v = appState.vehicles.find(x => x.regNo === regNo);
      if (!v) return;
      v.status = document.getElementById("editVStatus").value;
      v.km = parseInt(document.getElementById("editVKm").value, 10) || v.km;
      v.chargeHolder = document.getElementById("editVCharge").value.trim();
      v.attachment = document.getElementById("editVAttach").value.trim();
      closeModal("vehicleModal");
      saveState(`Vehicle ${regNo} updated (${v.status})`);
    }

    function deleteVehicle(regNo) {
      if (!confirm("Delete vehicle " + regNo + "?")) return;
      appState.vehicles = appState.vehicles.filter(x => x.regNo !== regNo);
      closeModal("vehicleModal");
      saveState(`Vehicle ${regNo} removed from fleet`);
    }

    // ==========================================
    // 8. ADD NEW PERSONNEL / VEHICLE (ADMIN)
    // ==========================================
    function openAddPersonnelModal() {
      document.getElementById("addModalTitle").innerText = "Add New MT Personnel";
      document.getElementById("addModalBody").innerHTML = `
        <form onsubmit="submitAddPersonnel(event)" class="space-y-2.5">
          <input type="text" id="newPForce" required placeholder="Force Number (e.g. 185012345)" class="w-full p-2.5 border rounded-xl font-bold" />
          <input type="text" id="newPRank" required placeholder="Rank (e.g. CT/DVR, HC/DVR, HC/MMV)" class="w-full p-2.5 border rounded-xl font-bold" />
          <input type="text" id="newPName" required placeholder="Full Name" class="w-full p-2.5 border rounded-xl font-bold" />
          <input type="text" id="newPMobile" required placeholder="Mobile Number" class="w-full p-2.5 border rounded-xl font-bold" />
          <input type="text" id="newPDl" placeholder="Driving License No (Only for DVR)" class="w-full p-2.5 border rounded-xl" />
          <button type="submit" class="w-full bg-emerald-700 text-white font-bold py-3 rounded-xl">ADD PERSONNEL</button>
        </form>
      `;
      document.getElementById("addEntityModal").classList.remove("hidden");
    }

    function submitAddPersonnel(e) {
      e.preventDefault();
      const forceNo = document.getElementById("newPForce").value.trim();
      if (appState.personnel.some(p => p.forceNo === forceNo)) {
        alert("Force Number already exists!");
        return;
      }
      const rank = document.getElementById("newPRank").value.trim().toUpperCase();
      const name = document.getElementById("newPName").value.trim().toUpperCase();
      const mobile = document.getElementById("newPMobile").value.trim();
      const dlNo = document.getElementById("newPDl").value.trim();

      appState.personnel.push({
        forceNo, rank, name, mobile,
        status: "PRESENT",
        attachment: "",
        dlNo: rank.includes("DVR") ? dlNo : "",
        dlValid: "",
        photo: ""
      });
      appState.passwords[forceNo] = "Mt@" + forceNo;
      closeModal("addEntityModal");
      saveState(`Added new staff: ${rank} ${name}`);
    }

    function openAddVehicleModal() {
      document.getElementById("addModalTitle").innerText = "Add New Vehicle to Fleet";
      document.getElementById("addModalBody").innerHTML = `
        <form onsubmit="submitAddVehicle(event)" class="space-y-2.5">
          <input type="text" id="newVReg" required placeholder="Registration No (e.g. TR01 AB 1234)" class="w-full p-2.5 border rounded-xl font-bold" />
          <input type="text" id="newVType" required placeholder="Vehicle Type (e.g. TATA BUS, BOLERO)" class="w-full p-2.5 border rounded-xl font-bold" />
          <input type="text" id="newVYear" required placeholder="Model Year (e.g. 2026)" class="w-full p-2.5 border rounded-xl font-bold" />
          <input type="text" id="newVCharge" placeholder="Charge Holder Driver Name" class="w-full p-2.5 border rounded-xl" />
          <button type="submit" class="w-full bg-emerald-700 text-white font-bold py-3 rounded-xl">ADD VEHICLE</button>
        </form>
      `;
      document.getElementById("addEntityModal").classList.remove("hidden");
    }

    function submitAddVehicle(e) {
      e.preventDefault();
      const regNo = document.getElementById("newVReg").value.trim().toUpperCase();
      if (appState.vehicles.some(v => v.regNo === regNo)) {
        alert("Vehicle already exists!");
        return;
      }
      appState.vehicles.push({
        regNo,
        type: document.getElementById("newVType").value.trim().toUpperCase(),
        year: document.getElementById("newVYear").value.trim(),
        inspDate: "Monthly",
        status: "PRESENT",
        attachment: "",
        chargeHolder: document.getElementById("newVCharge").value.trim().toUpperCase(),
        km: 0
      });
      closeModal("addEntityModal");
      saveState(`Added new vehicle: ${regNo}`);
    }

    // ==========================================
    // 9. DUTY ROSTER (HC & CT SELECTION)
    // ==========================================
    function populateDutyPersonnelDropdown() {
      const rankF = document.getElementById("dutyRankFilter").value;
      const sel = document.getElementById("dutyPersonnelSelect");

      const list = appState.personnel.filter(p => {
        if (rankF === "HC") return p.rank.startsWith("HC");
        if (rankF === "CT") return p.rank.startsWith("CT");
        if (rankF === "SO") return p.rank.startsWith("INSP") || p.rank.startsWith("SI") || p.rank.startsWith("ASI");
        return true;
      });

      sel.innerHTML = list.map(p => `<option value="${p.forceNo}">${p.rank} ${p.name} (${p.status})</option>`).join("");
    }

    function assignDuty() {
      const post = document.getElementById("dutyPostSelect").value;
      const forceNo = document.getElementById("dutyPersonnelSelect").value;
      const p = appState.personnel.find(x => x.forceNo === forceNo);
      if (!p) return;

      p.status = "ON DUTY";
      appState.duties.unshift({
        id: "DUTY-" + Date.now(),
        post,
        forceNo: p.forceNo,
        rank: p.rank,
        name: p.name,
        mobile: p.mobile,
        date: new Date().toLocaleDateString('en-IN')
      });

      saveState(`Duty Assigned: ${p.rank} ${p.name} → ${post}`);
    }

    function removeDuty(id) {
      const d = appState.duties.find(x => x.id === id);
      if (d) {
        const p = appState.personnel.find(x => x.forceNo === d.forceNo);
        if (p && p.status === "ON DUTY") p.status = "PRESENT";
      }
      appState.duties = appState.duties.filter(x => x.id !== id);
      saveState("Duty entry removed");
    }

    function renderDutyRoster() {
      populateDutyPersonnelDropdown();
      const container = document.getElementById("dutyRosterList");
      if (!appState.duties || appState.duties.length === 0) {
        container.innerHTML = `<p class="bg-white p-4 rounded-xl text-center text-xs text-slate-400 border">No active duties assigned yet.</p>`;
        return;
      }

      container.innerHTML = appState.duties.map(d => `
        <div class="bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between">
          <div>
            <span class="text-[10px] font-extrabold bg-amber-100 text-amber-900 px-2 py-0.5 rounded">${d.post}</span>
            <h4 class="text-xs font-extrabold text-slate-900 mt-1">${d.rank} ${d.name}</h4>
            <p class="text-[11px] text-slate-500">Force No: ${d.forceNo} • Mob: ${d.mobile} • Date: ${d.date}</p>
          </div>
          ${isAdmin() ? `<button onclick="removeDuty('${d.id}')" class="text-red-600 p-2 hover:bg-red-50 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
        </div>
      `).join("");
      lucide.createIcons();
    }

    // ==========================================
    // 10. DOCUMENTS UPLOAD, VIEW & SHARE
    // ==========================================
    function uploadDocument() {
      const title = document.getElementById("docTitle").value.trim();
      const fileInput = document.getElementById("docFileInput");
      const file = fileInput.files[0];

      if (!title || !file) {
        alert("Please enter Document Title and select a file.");
        return;
      }

      if (file.size > 4 * 1024 * 1024) {
        alert("Please select a file smaller than 4 MB for fast live sync across all mobiles.");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        appState.documents.unshift({
          id: "DOC-" + Date.now(),
          title,
          fileName: file.name,
          fileType: file.type,
          dataUrl: e.target.result,
          uploadedAt: new Date().toLocaleDateString('en-IN')
        });
        document.getElementById("docTitle").value = "";
        fileInput.value = "";
        saveState(`New Document Uploaded: ${title}`);
      };
      reader.readAsDataURL(file);
    }

    function renderDocuments() {
      const container = document.getElementById("documentsList");
      if (!appState.documents || appState.documents.length === 0) {
        container.innerHTML = `<p class="py-4 text-center text-xs text-slate-400">No official documents uploaded yet.</p>`;
        return;
      }

      container.innerHTML = appState.documents.map(doc => `
        <div class="py-3 flex items-center justify-between gap-2">
          <div>
            <h4 class="text-xs font-extrabold text-slate-900">${doc.title}</h4>
            <p class="text-[10px] text-slate-500">${doc.fileName} • ${doc.uploadedAt}</p>
          </div>
          <div class="flex items-center gap-1.5">
            <a href="${doc.dataUrl}" download="${doc.fileName}" class="bg-emerald-700 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-lg flex items-center gap-1">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> Save/Open
            </a>
            ${isAdmin() ? `<button onclick="deleteDoc('${doc.id}')" class="p-1.5 text-red-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
          </div>
        </div>
      `).join("");
      lucide.createIcons();
    }

    function deleteDoc(id) {
      appState.documents = appState.documents.filter(d => d.id !== id);
      saveState("Document deleted");
    }

    // ==========================================
    // 11. ADMIN PASSWORD RESET & ID TRANSFER
    // ==========================================
    function populateAdminDropdowns() {
      if (!isAdmin()) return;
      const options = appState.personnel.map(p => `<option value="${p.forceNo}">${p.rank} ${p.name} (${p.forceNo})</option>`).join("");
      document.getElementById("resetPassUserSelect").innerHTML = options;
      document.getElementById("transferAdminSelect").innerHTML = options;
    }

    function adminResetPassword() {
      const targetForceNo = document.getElementById("resetPassUserSelect").value;
      const customPass = document.getElementById("newPassInput").value.trim();
      const finalPass = customPass || ("Mt@" + targetForceNo);

      appState.passwords[targetForceNo] = finalPass;
      document.getElementById("newPassInput").value = "";
      saveState(`Password updated for Force No ${targetForceNo}`);
      alert(`Password for ${targetForceNo} is now set to: ${finalPass}`);
    }

    function transferAdminRights() {
      const newAdminForceNo = document.getElementById("transferAdminSelect").value;
      const target = appState.personnel.find(p => p.forceNo === newAdminForceNo);
      if (!target) return;

      if (!confirm(`Are you sure you want to transfer Admin Rights to ${target.rank} ${target.name}?`)) return;
      appState.adminForceNo = newAdminForceNo;
      saveState(`Admin ID transferred to ${target.rank} ${target.name}`);
    }

    // ==========================================
    // 12. CLEAN PDF EXPORTS (STRICTLY NO LEAVE COLUMN)
    // ==========================================
    function exportPersonnelPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(13);
      doc.text("DETAILS OF MT PLATOON GC CRPF, AGARTALA (WEST TRIPURA)", 14, 15);
      doc.setFontSize(9);
      doc.text(`Generated on: ${new Date().toLocaleDateString('en-IN')}`, 14, 21);

      const rows = appState.personnel.map((p, index) => [
        index + 1,
        p.forceNo,
        p.rank,
        p.name,
        p.mobile
      ]);

      doc.autoTable({
        startY: 25,
        head: [['SL NO', 'FORCE NO.', 'RANK', 'NAME', 'MOBILE NO.']],
        body: rows,
        theme: 'grid',
        headStyles: { fillColor: [15, 41, 30] },
        styles: { fontSize: 8.5 }
      });

      doc.save("MT_GC_AGT_Personnel_Details.pdf");
    }

    function exportVehiclesPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(13);
      doc.text("MT FLEET VEHICLE DETAILS - GC CRPF AGARTALA", 14, 15);

      const rows = appState.vehicles.map((v, index) => [
        index + 1,
        v.regNo,
        v.type,
        v.year,
        v.chargeHolder || "MT Pool"
      ]);

      doc.autoTable({
        startY: 22,
        head: [['SL NO', 'VEHICLE REG. NO.', 'TYPE OF VEHICLE', 'MODEL', 'CHARGE HOLDER']],
        body: rows,
        theme: 'grid',
        headStyles: { fillColor: [15, 41, 30] },
        styles: { fontSize: 8.5 }
      });

      doc.save("MT_GC_AGT_Vehicle_Details.pdf");
    }

    function exportDutyPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(13);
      doc.text("MT PLATOON DUTY ROSTER - GC CRPF AGARTALA", 14, 15);

      const rows = (appState.duties || []).map((d, index) => [
        index + 1,
        d.post,
        d.forceNo,
        d.rank,
        d.name,
        d.mobile
      ]);

      doc.autoTable({
        startY: 22,
        head: [['SL', 'DUTY POST', 'FORCE NO.', 'RANK', 'NAME', 'MOBILE']],
        body: rows,
        theme: 'grid',
        headStyles: { fillColor: [15, 41, 30] },
        styles: { fontSize: 8.5 }
      });

      doc.save("MT_GC_AGT_Duty_Roster.pdf");
    }

    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    // Boot Application
    loadState();
    lucide.createIcons();
    const savedSession = sessionStorage.getItem("MT_GC_AGT_USER");
    if (savedSession) {
      currentUser = appState.personnel.find(p => p.forceNo === savedSession);
      if (currentUser) enterApp();
    }
  </script>
</body>
</html>
