      { regNo: "AS01 DB 3013", type: "TATA BUS", year: "2011", inspDate: "27/11/2026", status: "PRESENT", attachment: "", chargeHolder: "CT/DVR AJEET SINGH", km: 118900 },
      { regNo: "AS01 EL 1349", type: "JCB", year: "2020", inspDate: "30/11/2026", status: "PRESENT", attachment: "", chargeHolder: "CT/DVR ATUL KUMAR", km: 12300 },
      { regNo: "TR01 G 0986", type: "TRACTOR", year: "2026", inspDate: "N/A", status: "ATTACHMENT", attachment: "ATTACHED WITH M&N SECTOR", chargeHolder: "CT/DVR RAMESH JAMBHALE", km: 2100 }
    ];

    // ==========================================
    // 2. APPLICATION STATE & LIVE SYNC ENGINE
    // ==========================================
    const STORAGE_KEY = "MT_GC_AGT_DB_LIVE_V2";
    let appState = {
      adminForceNo: "165060166", // Default Admin: Vikash Dubey
      passwords: {},
      personnel: INITIAL_PERSONNEL,
      vehicles: INITIAL_VEHICLES,
      gateLogs: [],
      duties: [],
      documents: [],
      lastNotification: null
    };

    window.getAppState = () => appState;

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          appState = {
            adminForceNo: parsed.adminForceNo || "165060166",
            passwords: parsed.passwords || {},
            personnel: parsed.personnel || INITIAL_PERSONNEL,
            vehicles: parsed.vehicles || INITIAL_VEHICLES,
            gateLogs: parsed.gateLogs || [],
            duties: parsed.duties || [],
            documents: parsed.documents || [],
            lastNotification: parsed.lastNotification || null
          };
        } catch (e) {
          console.error("State parse error:", e);
        }
      }
      appState.personnel.forEach(p => {
        if (!appState.passwords[p.forceNo]) {
          appState.passwords[p.forceNo] = "Mt@" + p.forceNo;
        }
      });
    }

    function saveState(notifyMsg = null) {
      if (notifyMsg) {
        appState.lastNotification = {
          msg: notifyMsg,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          id: Date.now()
        };
        showToast("MT GC AGT Update", notifyMsg);
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      if (window.cloudSyncEnabled && window.pushToCloud) {
        window.pushToCloud(appState);
      }
      refreshUI();
    }

    window.onCloudUpdate = (cloudData, shouldNotify) => {
      appState = {
        adminForceNo: cloudData.adminForceNo || "165060166",
        passwords: cloudData.passwords || {},
        personnel: cloudData.personnel || INITIAL_PERSONNEL,
        vehicles: cloudData.vehicles || INITIAL_VEHICLES,
        gateLogs: cloudData.gateLogs || [],
        duties: cloudData.duties || [],
        documents: cloudData.documents || [],
        lastNotification: cloudData.lastNotification || null
      };
      appState.personnel.forEach(p => {
        if (!appState.passwords[p.forceNo]) appState.passwords[p.forceNo] = "Mt@" + p.forceNo;
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      if (shouldNotify && appState.lastNotification) {
        showToast("Live Sync Alert", appState.lastNotification.msg);
      }
      refreshUI();
    };

    function showToast(title, msg) {
      const toast = document.getElementById("liveToast");
      document.getElementById("toastTitle").innerText = title;
      document.getElementById("toastMsg").innerText = msg;
      toast.classList.remove("hidden");
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.add("hidden"), 4500);
    }

    // ==========================================
    // 3. AUTHENTICATION & ROLE CONTROL
    // ==========================================
    let currentUser = null;

    function isAdmin() {
      return currentUser && currentUser.forceNo === appState.adminForceNo;
    }

    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const forceNo = document.getElementById("loginForceNo").value.trim();
      const pass = document.getElementById("loginPassword").value.trim();
      const errEl = document.getElementById("loginError");

      const person = appState.personnel.find(p => p.forceNo === forceNo);
      if (!person) {
        errEl.innerText = "Force Number not found in MT GC AGT records.";
        errEl.classList.remove("hidden");
        return;
      }

      const validPass = appState.passwords[forceNo] || ("Mt@" + forceNo);
      if (pass !== validPass) {
        errEl.innerText = "Incorrect Password! Default is Mt@" + forceNo;
        errEl.classList.remove("hidden");
        return;
      }

      errEl.classList.add("hidden");
      currentUser = person;
      sessionStorage.setItem("MT_GC_AGT_USER", forceNo);
      enterApp();
    });

    function enterApp() {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("mainApp").classList.remove("hidden");
      refreshUI();
    }

    function logout() {
      sessionStorage.removeItem("MT_GC_AGT_USER");
      currentUser = null;
      document.getElementById("mainApp").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
    }

    // ==========================================
    // 4. UI RENDERING & DASHBOARD COUNTERS
    // ==========================================
    function refreshUI() {
      if (!currentUser) return;
      currentUser = appState.personnel.find(p => p.forceNo === currentUser.forceNo) || currentUser;

      const roleLabel = isAdmin() ? "★ ADMIN" : "STAFF";
      document.getElementById("loggedUserInfo").innerText = `${currentUser.rank} ${currentUser.name} (${roleLabel})`;

      document.querySelectorAll(".admin-only").forEach(el => {
        if (isAdmin()) el.classList.remove("hidden");
        else el.classList.add("hidden");
      });

      updateDashboardCounts();
      renderGateLogs();
      renderPersonnel();
      renderVehicles();
      renderDutyRoster();
      renderDocuments();
      populateAdminDropdowns();
      lucide.createIcons();
    }

    function updateDashboardCounts() {
      const p = appState.personnel;
      document.getElementById("pTotalCount").innerText = `Total: ${p.length}`;
      document.getElementById("pPresentCount").innerText = p.filter(x => x.status === "PRESENT").length;
      document.getElementById("pDutyCount").innerText = p.filter(x => x.status === "ON DUTY").length;
      document.getElementById("pLeaveCount").innerText = p.filter(x => x.status === "LEAVE").length;
      document.getElementById("pCourseCount").innerText = p.filter(x => x.status === "COURSE").length;
      document.getElementById("pAttachCount").innerText = p.filter(x => x.status === "ATTACHMENT").length;
      document.getElementById("pOtherCount").innerText = p.filter(x => x.status === "OTHER").length;

      const v = appState.vehicles;
      document.getElementById("vTotalCount").innerText = `Total: ${v.length}`;
      document.getElementById("vPresentCount").innerText = v.filter(x => x.status === "PRESENT").length;
      document.getElementById("vDutyCount").innerText = v.filter(x => x.status === "ON DUTY").length;
      document.getElementById("vOffRoadCount").innerText = v.filter(x => x.status === "OFF ROAD").length;
      document.getElementById("vCbpCount").innerText = v.filter(x => x.status === "UNDER CBP").length;
      document.getElementById("vAttachCount").innerText = v.filter(x => x.status === "ATTACHMENT").length;
    }

    function filterPersonnelByStatus(status) {
      document.getElementById("personnelStatusFilter").value = status;
      switchTab("personnel");
    }

    function filterVehiclesByStatus(status) {
      document.getElementById("vehicleStatusFilter").value = status;
      switchTab("vehicles");
    }

    function switchTab(tabName) {
      ["dashboard", "personnel", "vehicles", "duty", "docs"].forEach(t => {
        document.getElementById("tab-" + t).classList.add("hidden");
        document.getElementById("nav-" + t).classList.replace("text-emerald-800", "text-slate-400");
      });
      document.getElementById("tab-" + tabName).classList.remove("hidden");
      document.getElementById("nav-" + tabName).classList.replace("text-slate-400", "text-emerald-800");
      lucide.createIcons();
    }

    // ==========================================
    // 5. VEHICLE GATE IN / OUT (ADMIN OR DRIVER)
    // ==========================================
    function openGateOutModal() {
      const vSel = document.getElementById("gateOutVehicle");
      const dSel = document.getElementById("gateOutDriver");

      const availVehicles = appState.vehicles.filter(v => v.status === "PRESENT");
      vSel.innerHTML = availVehicles.map(v => `<option value="${v.regNo}">${v.regNo} (${v.type})</option>`).join("");

      const drivers = appState.personnel.filter(p => p.rank.includes("DVR") || isAdmin());
      dSel.innerHTML = drivers.map(d => `<option value="${d.forceNo}" ${d.forceNo === currentUser.forceNo ? "selected" : ""}>${d.rank} ${d.name} (${d.forceNo})</option>`).join("");

      document.getElementById("gateOutModal").classList.remove("hidden");
    }

    function submitGateOut(e) {
      e.preventDefault();
      const regNo = document.getElementById("gateOutVehicle").value;
      const driverForceNo = document.getElementById("gateOutDriver").value;
      const outKm = parseInt(document.getElementById("gateOutKm").value, 10);
      const dest = document.getElementById("gateOutDest").value.trim();

      if (!isAdmin() && currentUser.forceNo !== driverForceNo) {
        alert("Permission Denied: Only Admin or the assigned Driver can mark this vehicle OUT.");
        return;
      }

      const driver = appState.personnel.find(p => p.forceNo === driverForceNo);
      const vehicle = appState.vehicles.find(v => v.regNo === regNo);
      if (!vehicle || !driver) return;

      vehicle.status = "ON DUTY";
      vehicle.km = outKm;
      driver.status = "ON DUTY";

      appState.gateLogs.unshift({
        id: "LOG-" + Date.now(),
        regNo: vehicle.regNo,
        vehicleType: vehicle.type,
        driverForceNo: driver.forceNo,
        driverName: `${driver.rank} ${driver.name}`,
        dest: dest,
        outKm: outKm,
        inKm: null,
        outTime: new Date().toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' }),
        inTime: null,
        active: true
      });

      closeModal("gateOutModal");
      saveState(`Vehicle ${regNo} OUT with ${driver.name} for ${dest}`);
    }

    function markVehicleIn(logId) {
      const log = appState.gateLogs.find(l => l.id === logId);
      if (!log) return;

      if (!isAdmin() && currentUser.forceNo !== log.driverForceNo) {
        alert("Only Admin or the Driver who took this vehicle (" + log.driverName + ") can mark it IN.");
        return;
      }

      const inKmStr = prompt(`Enter Closing / IN KM Reading for ${log.regNo} (OUT KM was ${log.outKm}):`, log.outKm + 15);
      if (!inKmStr) return;
      const inKm = parseInt(inKmStr, 10);

      log.active = false;
      log.inKm = inKm;
      log.inTime = new Date().toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' });

      const vehicle = appState.vehicles.find(v => v.regNo === log.regNo);
      if (vehicle) {
        vehicle.status = "PRESENT";
        vehicle.km = inKm;
      }

      const driver = appState.personnel.find(p => p.forceNo === log.driverForceNo);
      if (driver && driver.status === "ON DUTY") {
        driver.status = "PRESENT";
      }

      saveState(`Vehicle ${log.regNo} returned IN (${inKm} KM)`);
    }

    function renderGateLogs() {
      const container = document.getElementById("activeGateLogs");
      if (!appState.gateLogs || appState.gateLogs.length === 0) {
        container.innerHTML = `<p class="p-4 text-center text-xs text-slate-400">No vehicle IN/OUT movements recorded yet.</p>`;
        return;
      }

      container.innerHTML = appState.gateLogs.slice(0, 15).map(log => {
        const canIn = log.active && (isAdmin() || currentUser.forceNo === log.driverForceNo);
        return `
          <div class="p-3 flex items-center justify-between gap-2 ${log.active ? 'bg-amber-50/60' : 'bg-white'}">
            <div class="text-xs">
              <div class="flex items-center gap-2">
                <span class="font-extrabold text-slate-900">${log.regNo}</span>
                <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${log.active ? 'bg-blue-100 text-blue-800' : 'bg-emerald-100 text-emerald-800'}">
                  ${log.active ? 'OUT ON DUTY' : 'RETURNED IN'}
                </span>
              </div>
              <p class="text-slate-600 font-medium mt-0.5">${log.driverName} • <b>${log.dest}</b></p>
              <p class="text-[10px] text-slate-400 mt-0.5">OUT: ${log.outTime} (${log.outKm} km) ${log.inTime ? `| IN: ${log.inTime} (${log.inKm} km)` : ''}</p>
            </div>
            ${canIn ? `<button onclick="markVehicleIn('${log.id}')" class="bg-emerald-700 hover:bg-emerald-800 text-white text-[11px] font-bold px-3 py-1.5 rounded-lg shrink-0 shadow">MARK IN</button>` : ''}
          </div>
        `;
      }).join("");
    }

    // ==========================================
    // 6. PERSONNEL DIRECTORY & PROFILE MODAL
    // ==========================================
    function getStatusBadge(status) {
      const map = {
        "PRESENT": "bg-emerald-100 text-emerald-800 border-emerald-300",
        "ON DUTY": "bg-blue-100 text-blue-800 border-blue-300",
        "LEAVE": "bg-red-100 text-red-800 border-red-300",
        "COURSE": "bg-purple-100 text-purple-800 border-purple-300",
        "ATTACHMENT": "bg-amber-100 text-amber-800 border-amber-300",
        "OFF ROAD": "bg-red-100 text-red-800 border-red-300",
        "UNDER CBP": "bg-orange-100 text-orange-800 border-orange-300",
        "OTHER": "bg-slate-200 text-slate-800 border-slate-300"
      };
      return map[status] || "bg-slate-100 text-slate-700";
    }

    function renderPersonnel() {
      const q = document.getElementById("personnelSearch").value.toLowerCase();
      const statusF = document.getElementById("personnelStatusFilter").value;

      const filtered = appState.personnel.filter(p => {
        const matchQ = p.name.toLowerCase().includes(q) || p.forceNo.includes(q) || p.rank.toLowerCase().includes(q);
        const matchS = statusF === "ALL" || p.status === statusF;
        return matchQ && matchS;
      });

      document.getElementById("personnelList").innerHTML = filtered.map(p => `
        <div onclick="openPersonnelDetail('${p.forceNo}')" class="cursor-pointer bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3 hover:border-emerald-600 transition">
          <div class="flex items-center gap-3">
            ${p.photo 
              ? `<img src="${p.photo}" class="w-11 h-11 rounded-full object-cover border border-slate-300 shrink-0" />`
              : `<div class="w-11 h-11 rounded-full bg-emerald-900 text-white font-bold text-xs flex items-center justify-center shrink-0">${p.name.substring(0,2)}</div>`
            }
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-extrabold bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded">${p.rank}</span>
                <h3 class="text-xs font-extrabold text-slate-900">${p.name}</h3>
                ${p.forceNo === appState.adminForceNo ? `<span class="text-[9px] bg-amber-400 text-slate-950 font-extrabold px-1.5 rounded">ADMIN</span>` : ''}
              </div>
              <p class="text-[11px] text-slate-500 mt-0.5">Force No: <b>${p.forceNo}</b> • Mob: ${p.mobile}</p>
              ${p.attachment ? `<p class="text-[10px] text-amber-700 font-semibold">Att: ${p.attachment}</p>` : ''}
            </div>
          </div>
          <div class="flex flex-col items-end gap-1.5 shrink-0">
            <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full border ${getStatusBadge(p.status)}">${p.status}</span>
            <a href="tel:${p.mobile}" onclick="event.stopPropagation()" class="p-1.5 bg-emerald-50 text-emerald-700 rounded-lg border border-emerald-200">
              <i data-lucide="phone-call" class="w-3.5 h-3.5"></i>
            </a>
          </div>
        </div>
      `).join("");
      lucide.createIcons();
    }

    function openPersonnelDetail(forceNo) {
      const p = appState.personnel.find(x => x.forceNo === forceNo);
      if (!p) return;
      const isDriver = p.rank.includes("DVR");

      let html = `
        <div class="flex flex-col items-center text-center pb-3 border-b">
          ${p.photo 
            ? `<img src="${p.photo}" class="w-24 h-24 rounded-full object-cover border-2 border-emerald-700 shadow mb-2" />`
            : `<div class="w-20 h-20 rounded-full bg-emerald-900 text-white text-xl font-extrabold flex items-center justify-center mb-2">${p.name.substring(0,2)}</div>`
          }
          <h4 class="text-base font-extrabold text-slate-900">${p.rank} ${p.name}</h4>
          <p class="text-slate-500 font-semibold">Force No: ${p.forceNo} | Mobile: ${p.mobile}</p>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl">
          <div><span class="text-slate-400 block">Current Status</span><b class="text-slate-800">${p.status}</b></div>
          <div><span class="text-slate-400 block">Attachment / Duty</span><b class="text-slate-800">${p.attachment || 'MT Platoon'}</b></div>
        </div>
      `;

      if (isDriver) {
        html += `
          <div class="bg-amber-50 border border-amber-300 p-3 rounded-xl">
            <p class="font-extrabold text-amber-900 flex items-center gap-1.5 mb-1">
              <i data-lucide="id-card" class="w-4 h-4"></i> Driving License (Driver Only)
            </p>
            <p>DL Number: <b>${p.dlNo || 'Not Updated'}</b></p>
            <p>Valid Upto: <b>${p.dlValid || 'Not Updated'}</b></p>
          </div>
        `;
      }

      if (isAdmin()) {
        html += `
          <div class="border-t pt-3 space-y-2.5">
            <p class="font-extrabold text-emerald-800 uppercase">Admin Edit Details & Photo</p>
            <div>
              <label class="font-bold text-slate-600">Upload / Change Photo (Visible to All)</label>
              <input type="file" accept="image/*" onchange="handlePhotoUpload(event, '${p.forceNo}')" class="w-full mt-1 text-xs" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="font-bold text-slate-600">Rank</label>
                <input type="text" id="editPRank" value="${p.rank}" class="w-full p-2 border rounded-lg font-bold" />
              </div>
              <div>
                <label class="font-bold text-slate-600">Mobile No</label>
                <input type="text" id="editPMobile" value="${p.mobile}" class="w-full p-2 border rounded-lg font-bold" />
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="font-bold text-slate-600">CRPF Status</label>
                <select id="editPStatus" class="w-full p-2 border rounded-lg font-bold">
                  <option value="PRESENT" ${p.status==='PRESENT'?'selected':''}>PRESENT</option>
                  <option value="ON DUTY" ${p.status==='ON DUTY'?'selected':''}>ON DUTY</option>
                  <option value="LEAVE" ${p.status==='LEAVE'?'selected':''}>LEAVE</option>
                  <option value="COURSE" ${p.status==='COURSE'?'selected':''}>COURSE</option>
                  <option value="ATTACHMENT" ${p.status==='ATTACHMENT'?'selected':''}>ATTACHMENT</option>
                  <option value="OTHER" ${p.status==='OTHER'?'selected':''}>REST / HOSPITAL</option>
                </select>
              </div>
              <div>
                <label class="font-bold text-slate-600">Attachment / Place</label>
                <input type="text" id="editPAttach" value="${p.attachment || ''}" placeholder="e.g. DIG Office / Course" class="w-full p-2 border rounded-lg" />
              </div>
            </div>
            ${isDriver ? `
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="font-bold text-slate-600">DL Number</label>
                  <input type="text" id="editPDlNo" value="${p.dlNo || ''}" class="w-full p-2 border rounded-lg font-bold" />
                </div>
                <div>
                  <label class="font-bold text-slate-600">DL Valid Date</label>
                  <input type="date" id="editPDlValid" value="${p.dlValid || ''}" class="w-full p-2 border rounded-lg font-bold" />
                </div>
              </div>
            ` : ''}
            <div class="flex gap-2 pt-2">
              <button onclick="savePersonnelEdit('${p.forceNo}')" class="flex-1 bg-emerald-700 text-white font-bold py-2.5 rounded-xl">SAVE CHANGES</button>
              <button onclick="deletePersonnel('${p.forceNo}')" class="bg-red-600 text-white font-bold px-3 py-2.5 rounded-xl">DELETE</button>
